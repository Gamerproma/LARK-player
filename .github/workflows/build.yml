name: Crear APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Crear proyecto base con plantilla app
        run: flutter create --org com.mimusica --project-name mi_musica --platforms android --template=app .

      - name: Configurar SDK de Android
        run: |
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties

      - name: Inyectar dependencias limpias en pubspec
        run: |
          sed -i '/dependencies:/a \  just_audio: ^0.9.40\n  just_audio_background:\n  on_audio_query_forked:\n  on_audio_query_android:\n  image_picker:\n  path_provider:\n  shared_preferences:' pubspec.yaml
          flutter pub get

      - name: Copiar código principal
        run: |
          cp main.dart lib/main.dart

      - name: Sincronizar compatibilidad de Java y Kotlin en Gradle
        run: |
          echo "subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                      }
                  }
              }
          }" >> android/build.gradle
          echo "tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = '17'
              }
          }" >> android/app/build.gradle

      - name: Crear APK
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: mi-musica-apk
          path: build/app/outputs/flutter-apk/app-release.apk
