name: Crear APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Crear proyecto Flutter limpio en carpeta temporal
        run: |
          flutter create --org com.mimusica --platforms android temp_project
          cp -r temp_project/android .
          cp -r temp_project/ios .
          cp -r temp_project/web .
          cp -r temp_project/linux .
          cp -r temp_project/macos .
          cp -r temp_project/windows .
          rm -rf temp_project

      - name: Configurar SDK de Android
        run: |
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties

      - name: Escribir pubspec.yaml completo con dependencias
        run: |
          cat << 'EOF' > pubspec.yaml
          name: mi_musica
          description: "A new Flutter project."
          publish_to: "none"
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            just_audio: ^0.9.40
            just_audio_background: ^0.0.1-beta.14
            on_audio_query_forked: ^2.9.1
            on_audio_query_android: ^1.1.0
            image_picker: ^1.0.7
            path_provider: ^2.1.2
            shared_preferences: ^2.2.2

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF
          flutter pub get

      - name: Copiar código principal
        run: |
          mkdir -p lib
          cp main.dart lib/main.dart

      - name: Sincronizar compatibilidad de Java y Kotlin en Gradle
        run: |
          echo "subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                      }
                  }
              }
          }" >> android/build.gradle
          echo "tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = '17'
              }
          }" >> android/app/build.gradle

      - name: Crear APK definitivo
        env:
          CI: "true"
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: mi-musica-apk
          path: build/app/outputs/flutter-apk/app-release.apk
